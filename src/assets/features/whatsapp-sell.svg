<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 447" role="img" aria-label="A phone showing a WhatsApp message with produce details next to a crate of tomatoes">
  <rect width="820" height="447" fill="#F6F8E9"/>
  <circle cx="410" cy="223" r="188" fill="#D5EAD0"/>
  <!-- leaves -->
  <path d="M168 372C128 300 148 238 214 210C222 276 206 332 168 372Z" fill="#9BCB98"/>
  <path d="M660 372C700 312 690 258 636 232C624 284 634 332 660 372Z" fill="#9BCB98"/>
  <path d="M600 150C640 120 668 128 684 152C650 176 618 172 600 150Z" fill="#B7DAB1"/>
  <!-- ground shadow -->
  <ellipse cx="300" cy="360" rx="150" ry="14" fill="#B8D6B3"/>
  <!-- crate of tomatoes -->
  <g>
    <circle cx="238" cy="268" r="24" fill="#D8412A"/><circle cx="286" cy="262" r="26" fill="#E24D32"/>
    <circle cx="334" cy="268" r="24" fill="#D8412A"/><circle cx="262" cy="244" r="24" fill="#E24D32"/>
    <circle cx="312" cy="242" r="24" fill="#D8412A"/><circle cx="288" cy="226" r="22" fill="#E8573A"/>
    <path d="M250 232l8-8m24-4l6-8m22 12l8-6" stroke="#2E7D42" stroke-width="5" stroke-linecap="round"/>
    <rect x="206" y="268" width="156" height="92" rx="8" fill="#2F7D45"/>
    <rect x="206" y="268" width="156" height="14" rx="6" fill="#256A39"/>
    <g fill="#1F5A31"><rect x="222" y="292" width="124" height="10" rx="5"/><rect x="222" y="314" width="124" height="10" rx="5"/><rect x="222" y="336" width="124" height="10" rx="5"/></g>
  </g>
  <!-- phone -->
  <g>
    <rect x="450" y="62" width="206" height="330" rx="30" fill="#1E2A24"/>
    <rect x="460" y="74" width="186" height="306" rx="22" fill="#EFF5EC"/>
    <rect x="460" y="74" width="186" height="46" rx="22" fill="#1B5E37"/>
    <rect x="460" y="98" width="186" height="22" fill="#1B5E37"/>
    <circle cx="486" cy="98" r="12" fill="#E7F1EA"/>
    <path d="M481 99c1-4 4-6 6-6s5 2 5 6" stroke="#1B5E37" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="506" y="103" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">RaithaMarga</text>
    <!-- outgoing bubble -->
    <g>
      <rect x="500" y="136" width="140" height="92" rx="12" fill="#D9F7C5"/>
      <text x="512" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#26402F">Name: Ramesh</text>
      <text x="512" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#26402F">Produce: Tomato</text>
      <text x="512" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#26402F">Quantity: 50 kg</text>
      <text x="512" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#26402F">Price: &#8377;20 / kg</text>
    </g>
    <!-- incoming bubble -->
    <g>
      <rect x="470" y="244" width="124" height="52" rx="12" fill="#FFFFFF"/>
      <text x="482" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1B5E37">Your produce is</text>
      <text x="482" y="283" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1B5E37">listed &#10003;</text>
    </g>
    <!-- input bar -->
    <rect x="472" y="338" width="130" height="26" rx="13" fill="#FFFFFF"/>
    <circle cx="624" cy="351" r="14" fill="#25A244"/>
    <path d="M618 351h12m-5-5l5 5-5 5" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- verified shield -->
  <g transform="translate(618 296)">
    <path d="M40 4 76 18v34c0 24-15 40-36 48C19 92 4 76 4 52V18Z" fill="#CFE8CB" stroke="#7DB57E" stroke-width="3"/>
    <path d="M24 52l12 12 22-24" stroke="#2F7D45" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
